name: Blog Bot - Generate
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Generate up to 50 drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_DAILY_LIMIT: ${{ vars.BLOG_DAILY_LIMIT || '50' }}
        run: python scripts/generate_posts.py
      - name: Commit drafts
        run: |
          git config user.name "Online Fraud Fighter Blog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content data
          git diff --cached --quiet || git commit -m "Generate daily blog drafts"
          git push
